<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Shop Floor" />
<meta name="theme-color" content="#161412" />
<link rel="manifest" href="manifest.webmanifest" />
<title>Shop Floor</title>
<style>
:root{--ink:#161412;--paper:#f4efe6;--card:#fffdf8;--brass:#b4843a;--soft:#5c5348;--line:#e4d9c6;--ok:#2f6b45}
*{box-sizing:border-box}html,body{margin:0;background:var(--paper);color:var(--ink)}body{font-family:Palatino,Georgia,serif;min-height:100dvh;padding:env(safe-area-inset-top) 0 calc(64px + env(safe-area-inset-bottom))}button,input,textarea{font-family:inherit}header.bar{background:var(--ink);color:#f4efe6;padding:16px;border-bottom:4px solid var(--brass);position:sticky;top:0}header.bar .kicker{letter-spacing:.16em;font-size:11px;color:var(--brass);font-weight:700}header.bar h1{margin:4px 0 0;font-size:24px}header.bar p{margin:4px 0 0;color:#d9cbb6;font-size:14px;font-style:italic}main{max-width:720px;margin:0 auto;padding:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}h2{margin:0 0 6px}.hint{color:var(--soft);margin:0 0 12px}.shot{display:grid;grid-template-columns:88px 1fr;gap:12px;padding:12px 0;border-top:1px solid var(--line)}.shot:first-of-type{border-top:0}.thumb{width:88px;height:88px;border-radius:10px;background:#efe7da;display:grid;place-items:center;overflow:hidden}.thumb img{width:100%;height:100%;object-fit:cover}label.file{display:inline-block;background:var(--ink);color:#f4efe6;padding:10px 12px;border-radius:8px}input[type=file]{display:none}label.field{display:block;font-size:12px;letter-spacing:.06em;font-weight:700;margin:12px 0 6px}input[type=text],input[type=password],textarea{width:100%;border:1px solid #d9cdb8;border-radius:10px;padding:12px;font-size:17px}textarea{min-height:100px}.row{display:flex;gap:10px;margin-top:12px}button.primary,button.ghost,button.warn{border:0;border-radius:12px;padding:14px 16px;font-size:17px}button.primary{background:var(--brass);font-weight:700;flex:1}button.ghost{background:transparent;border:1px solid #d9cdb8}button.warn{background:var(--ink);color:#f4efe6;width:100%;font-weight:700}button:disabled{opacity:.45}.check{display:flex;gap:10px;margin:8px 0}.box{width:18px;height:18px;border:1.5px solid var(--ink);border-radius:4px;display:grid;place-items:center}.box.on{background:var(--ok);color:#fff;border-color:var(--ok)}nav.dock{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--ink);padding:8px 8px calc(8px + env(safe-area-inset-bottom));gap:6px}nav.dock button{flex:1;background:transparent;color:#d9cbb6;border:0;padding:10px 4px}nav.dock button.on{background:#2a241c;color:var(--brass)}.toast{position:fixed;left:12px;right:12px;bottom:78px;background:var(--ink);color:#f4efe6;padding:12px;border-radius:12px;display:none}.preview-note{white-space:pre-wrap;background:#f7f1e6;border-radius:10px;padding:12px}
</style>
</head>
<body>
<header class="bar"><div class="kicker">TWISTED GENIUS</div><h1>Shop Floor</h1><p>Shoot it. Write three lines. It lands on the command center.</p></header>
<main id="app"></main>
<nav class="dock"><button id="tab-shoot" class="on">New piece</button><button id="tab-open">Open</button><button id="tab-key">Shop key</button></nav>
<div class="toast" id="toast"></div>
<script>
const STORE="https://antmanthepro.github.io/TwistedsCommandCenter/shop/captures/";
const REPO="AntManThePro/TwistedsCommandCenter";
const BRANCH="main";
const $=(s,r=document)=>r.querySelector(s);
const app=$("#app");
const KEY="tg-shop-floor-v2";
const TOKEN_KEY="tg-shop-github-token";
let screen="shoot", current=null;
function token(){return localStorage.getItem(TOKEN_KEY)||""}
function today(){const d=new Date(),p=n=>String(n).padStart(2,"0");return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())}
function uid(){return Math.random().toString(36).slice(2,8)}
function blank(){return {id:uid(),name:"",materials:"",highlight:"",date:today(),photos:{wide:null,detail:null,context:null},updated:Date.now()}}
function toast(msg){const t=$("#toast");t.textContent=msg;t.style.display="block";clearTimeout(toast._t);toast._t=setTimeout(()=>t.style.display="none",2800)}
function esc(s){return String(s??"").replace(/[&<>\"']/g,c=>({"&":"&","<":"<",">":">","\"":""","'":"&#39;"}[c]))}
function slug(p){return ((p.name||"piece").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||"piece")+"_"+(p.date||today())}
function ready(p){return p.name.trim()&&p.materials.trim()&&p.highlight.trim()&&p.photos.wide&&p.photos.detail}
function cardText(p){return [p.name||"Untitled",p.date,"","Made of: "+(p.materials||"\u2014"),"","Highlight: "+(p.highlight||"\u2014")].join("\n")}
function openDb(){return new Promise((res,rej)=>{const r=indexedDB.open("tg-shop-floor",1);r.onupgradeneeded=()=>r.result.createObjectStore("photos");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function putPhoto(id,slot,blob){const db=await openDb();await new Promise((res,rej)=>{const tx=db.transaction("photos","readwrite");tx.objectStore("photos").put(blob,id+":"+slot);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)});db.close()}
async function getPhoto(id,slot){const db=await openDb();const blob=await new Promise((res,rej)=>{const tx=db.transaction("photos","readonly");const q=tx.objectStore("photos").get(id+":"+slot);q.onsuccess=()=>res(q.result||null);q.onerror=()=>rej(q.error)});db.close();return blob}
function loadMeta(){try{return JSON.parse(localStorage.getItem(KEY))||{drafts:[],sent:[]}}catch{return {drafts:[],sent:[]}}}
function saveMeta(state){const pack=list=>list.map(p=>({id:p.id,name:p.name,materials:p.materials,highlight:p.highlight,date:p.date,updated:p.updated,slots:["wide","detail","context"].filter(k=>p.photos[k])}));localStorage.setItem(KEY,JSON.stringify({drafts:pack(state.drafts),sent:pack(state.sent)}))}
const state={drafts:[],sent:[]};
async function hydrate(meta){const piece={...meta,photos:{wide:null,detail:null,context:null}};for(const slot of meta.slots||[]){const blob=await getPhoto(meta.id,slot);if(!blob)continue;piece.photos[slot]={url:URL.createObjectURL(blob),blob}}return piece}
function persist(){const i=state.drafts.findIndex(p=>p.id===current.id);if(i>=0)state.drafts[i]=current;else state.drafts.push(current);saveMeta(state)}
function render(){$("#tab-shoot").classList.toggle("on",screen==="shoot"||screen==="write"||screen==="drop");$("#tab-open").classList.toggle("on",screen==="open");$("#tab-key").classList.toggle("on",screen==="key");if(screen==="shoot")return shoot();if(screen==="write")return write();if(screen==="drop")return drop();if(screen==="open")return openList();if(screen==="key")return keyScreen()}
function shoot(){if(!current)current=blank();const slots=[["wide","Wide shot","Whole piece. Straight on.",true],["detail","Detail shot","Weld, joint, grain, hardware.",true],["context","Context shot","Optional. Bench or a tool for scale.",false]];app.innerHTML=`<div class="card"><h2>Three photos</h2><p class="hint">Good light. Hold still. These go on the command center.</p>${slots.map(([k,t,d,req])=>`<div class="shot"><div class="thumb">${current.photos[k]?`<img src="${current.photos[k].url}" alt="">`:"No photo"}</div><div><b>${t}${req?"":" \u00b7 optional"}</b><p class="hint">${d}</p><label class="file">${current.photos[k]?"Retake":"Take photo"}<input type="file" accept="image/*" capture="environment" data-slot="${k}"></label></div></div>`).join("")}</div><button class="primary" id="next" ${current.photos.wide&&current.photos.detail?"":"disabled"}>Next \u00b7 write it</button>`;$("#next").onclick=()=>{persist();screen="write";render()};app.querySelectorAll("input[type=file]").forEach(inp=>inp.onchange=()=>take(inp))}
function take(inp){const file=inp.files&&inp.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{const img=new Image();img.onload=()=>{const max=1200,scale=Math.min(1,max/Math.max(img.width,img.height));const canvas=document.createElement("canvas");canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);canvas.getContext("2d").drawImage(img,0,0,canvas.width,canvas.height);canvas.toBlob(async blob=>{current.photos[inp.dataset.slot]={url:URL.createObjectURL(blob),blob};current.updated=Date.now();await putPhoto(current.id,inp.dataset.slot,blob);persist();render()},"image/jpeg",0.72)};img.src=reader.result};reader.readAsDataURL(file)}
function write(){app.innerHTML=`<div class="card"><h2>Three lines</h2><p class="hint">Shop talk. No sales copy.</p><label class="field">WHAT IS IT</label><input id="name" type="text" placeholder="Copper sconce" value="${esc(current.name)}"><label class="field">DATE FINISHED</label><input id="date" type="text" value="${esc(current.date)}"><label class="field">WHAT IT IS MADE OF</label><input id="mat" type="text" placeholder="16-gauge steel, copper tubing" value="${esc(current.materials)}"><label class="field">THE HIGHLIGHT</label><textarea id="hi" placeholder="Hardest part, or what makes it hold up.">${esc(current.highlight)}</textarea></div><div class="row"><button class="ghost" id="back">Photos</button><button class="primary" id="next">Next \u00b7 send it</button></div>`;const pull=()=>{current.name=$("#name").value;current.date=$("#date").value;current.materials=$("#mat").value;current.highlight=$("#hi").value;current.updated=Date.now();persist()};["name","date","mat","hi"].forEach(id=>document.getElementById(id).addEventListener("input",pull));$("#back").onclick=()=>{pull();screen="shoot";render()};$("#next").onclick=()=>{pull();screen="drop";render()}}
function drop(){const ok=ready(current);app.innerHTML=`<div class="card"><h2>Send to the board</h2><p class="hint">Lands on the command center shop board.</p><div class="check"><div class="box ${current.photos.wide?"on":""}">${current.photos.wide?"\u2713":""}</div><div>Wide shot</div></div><div class="check"><div class="box ${current.photos.detail?"on":""}">${current.photos.detail?"\u2713":""}</div><div>Detail shot</div></div><div class="check"><div class="box ${current.name.trim()?"on":""}">${current.name.trim()?"\u2713":""}</div><div>Name, materials, highlight</div></div><p class="preview-note">${esc(cardText(current))}</p><p class="hint">${esc(STORE)}</p></div><button class="warn" id="pack" ${ok?"":"disabled"}>${ok?(token()?"Send to command center":"Need the shop key first"):"Need wide, detail, and the three lines"}</button><div class="row"><button class="ghost" id="back">Edit</button><button class="ghost" id="key">Shop key</button></div>`;$("#back").onclick=()=>{screen="write";render()};$("#key").onclick=()=>{screen="key";render()};$("#pack").onclick=()=>send(current)}
function openList(){const open=state.drafts.slice().sort((a,b)=>b.updated-a.updated);const sent=state.sent.slice().sort((a,b)=>b.updated-a.updated);app.innerHTML=`<div class="card"><h2>Still open</h2>${open.length?open.map(p=>`<p><b>${esc(p.name||"Untitled")}</b><br><button class="ghost" data-open="${p.id}">Open</button></p>`).join(""):`<p class="hint">Nothing waiting.</p>`}</div><div class="card"><h2>Sent</h2>${sent.length?sent.map(p=>`<p><b>${esc(p.name)}</b><br><span class="hint">${esc(p.date)}</span></p>`).join(""):`<p class="hint">None yet.</p>`}<p><a href="${STORE}">Open the board</a></p></div>`;app.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>{current=state.drafts.find(p=>p.id===b.dataset.open);screen="shoot";render()})}
function keyScreen(){app.innerHTML=`<div class="card"><h2>Shop key</h2><p class="hint">One time. Lets this phone write the piece onto the command center. Stays on this phone.</p><label class="field">GITHUB SHOP KEY</label><input id="tok" type="password" placeholder="${token()?"Key saved on this phone":"Paste the key"}"><div class="row"><button class="primary" id="save">Save key</button><button class="ghost" id="clear">Clear</button></div><p class="hint">${token()?"A key is already saved.":"No key yet. Sends will wait."}</p></div>`;$("#save").onclick=()=>{const v=$("#tok").value.trim();if(!v)return toast("Paste the key first.");localStorage.setItem(TOKEN_KEY,v);toast("Key saved on this phone.");screen=current?"drop":"shoot";render()};$("#clear").onclick=()=>{localStorage.removeItem(TOKEN_KEY);toast("Key cleared.");render()}}
async function gh(path,method,body){const res=await fetch("https://api.github.com/repos/"+REPO+"/contents/"+path,{method,headers:{Authorization:"Bearer "+token(),Accept:"application/vnd.github+json","Content-Type":"application/json"},body:body?JSON.stringify(body):undefined});const data=await res.json().catch(()=>({}));if(!res.ok)throw new Error(data.message||("GitHub "+res.status));return data}
function b64(buf){let s="";const bytes=new Uint8Array(buf);for(let i=0;i<bytes.length;i++)s+=String.fromCharCode(bytes[i]);return btoa(s)}
async function putFile(path,contentB64,message,sha){return gh(path,"PUT",{message,content:contentB64,branch:BRANCH,sha})}
async function send(p){if(!token()){screen="key";render();return}const btn=$("#pack");btn.disabled=true;btn.textContent="Sending\u2026";const folder="public/shop/captures/"+slug(p);try{let indexSha=null,index={pieces:[]};try{const cur=await gh("public/shop/captures/index.json","GET");indexSha=cur.sha;index=JSON.parse(atob(cur.content.replace(/\n/g,"")));if(!Array.isArray(index.pieces))index.pieces=[]}catch(e){if(!/404/.test(String(e.message)))throw e}const photos=[];for(const slot of ["wide","detail","context"]){if(!p.photos[slot])continue;const buf=await p.photos[slot].blob.arrayBuffer();await putFile(folder+"/"+slot+".jpg",b64(buf),"Shop floor photo "+slot+" "+p.name);photos.push(slot)}const record={id:p.id,name:p.name,date:p.date,materials:p.materials,highlight:p.highlight,photos,slug:slug(p)};await putFile(folder+"/build.json",btoa(unescape(encodeURIComponent(JSON.stringify(record,null,2)))),"Shop floor card "+p.name);index.pieces=index.pieces.filter(x=>x.slug!==record.slug);index.pieces.unshift(record);await putFile("public/shop/captures/index.json",btoa(unescape(encodeURIComponent(JSON.stringify(index,null,2)))),"Shop floor index "+p.name,indexSha||undefined);state.drafts=state.drafts.filter(x=>x.id!==p.id);if(!state.sent.find(x=>x.id===p.id))state.sent.unshift(p);saveMeta(state);toast("Sent. The board updates after the site rebuilds.");current=blank();screen="open";render()}catch(err){btn.disabled=false;btn.textContent="Send to command center";toast(err.message||"Send failed")}}
$("#tab-shoot").onclick=()=>{if(!current)current=blank();screen="shoot";render()};
$("#tab-open").onclick=()=>{screen="open";render()};
$("#tab-key").onclick=()=>{screen="key";render()};
(async()=>{const meta=loadMeta();state.drafts=await Promise.all((meta.drafts||[]).map(hydrate));state.sent=await Promise.all((meta.sent||[]).map(hydrate));current=blank();render()})();
</script>
</body>
</html>
